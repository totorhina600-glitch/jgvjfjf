name: PERTURABO — F04_COPYWRITER PUR (VOX direct)

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'URL VOD traitée par VOX'
        required: true
        default: 'https://www.twitch.tv/videos/2864600351'
      candidats_path:
        description: 'Chemin candidats.json VOX (repo-relatif)'
        required: false
        default: 'MONDES_FORGES/CLIPPING/ARCHIVUM/montage/transcripts/v2864600351_candidats.json'
      platform:
        description: 'Plateforme cible'
        required: false
        default: 'youtube_shorts'
      market:
        description: 'Marché cible'
        required: false
        default: 'us_young_english'

jobs:
  copywriting:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      NVIDIA_NIM_MODEL: moonshotai/kimi-k3
      CLIPPING_PREMIUM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Adaptateur PUR direct (VOX -> angles + specimen)
        run: |
          python MONDES_FORGES/CLIPPING/pur_adapter_direct.py \
            --candidats "${{ inputs.candidats_path }}" \
            --vod "${{ inputs.vod_url }}" \
            --platform "${{ inputs.platform }}" \
            --market "${{ inputs.market }}"

      - name: Write copywriter_secrets.json (NVIDIA, provider other)
        run: |
          mkdir -p MONDES_FORGES/CLIPPING/CONTRACTS
          cat > MONDES_FORGES/CLIPPING/CONTRACTS/copywriter_secrets.json <<'EOF'
          {
            "env_var_name": "CLIPPING_PREMIUM_API_KEY",
            "model_id": "moonshotai/kimi-k3",
            "provider": "other",
            "base_url": "https://integrate.api.nvidia.com/v1",
            "max_tokens_per_call": 8192,
            "temperature_default": 0.7
          }
          EOF
          echo "copywriter_secrets.json -> NVIDIA (kimi-k3)"

      - name: F04 setup-context (premier angle)
        run: |
          python MONDES_FORGES/CLIPPING/F04_COPYWRITER/CODEBASE/copywriter.py \
            --setup-context --angle A01 --platform "${{ inputs.platform }}" --market "${{ inputs.market }}"

      - name: F04 generate (premium direct) + ordonnance + finalize (A01)
        run: |
          cd MONDES_FORGES/CLIPPING/F04_COPYWRITER/CODEBASE
          python copywriter.py --generate --angle A01 --force
          python copywriter.py --ordonnance --angle A01 --auto-ord
          python copywriter.py --finalize --angle A01

      - name: Commit copywriting output (ARCHIVUM only)
        run: |
          git config user.name "OracleF04"
          git config user.email "oracle@perturabo.iron"
          mkdir -p MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting
          cp MONDES_FORGES/CLIPPING/F04_COPYWRITER/OUT/text_payload_*.json MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting/ 2>/dev/null || true
          cp MONDES_FORGES/CLIPPING/F04_COPYWRITER/OUT/text_payload_*.md   MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting/ 2>/dev/null || true
          git add MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting
          git commit -m "[F04] copywriting PUR -> ARCHIVUM/copywriting" || echo "nothing to commit"
          git push origin HEAD:main
